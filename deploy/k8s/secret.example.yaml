# Template for the secrets Secret. Apply real values via your secret
# manager (e.g. `kubectl create secret` or External Secrets Operator).
# Never commit real keys here.
apiVersion: v1
kind: Secret
metadata:
  name: live-ai-assistant-secrets
type: Opaque
stringData:
  GOOGLE_API_KEY: "REPLACE_WITH_REAL_KEY_OR_USE_EXTERNAL_SECRETS"
  TAVILY_API_KEY: "REPLACE_WITH_REAL_KEY_OR_USE_EXTERNAL_SECRETS"
  APP_API_KEY: "REPLACE_WITH_A_RANDOM_LONG_TOKEN"
  # Optional fallback providers:
  # OPENAI_API_KEY: "sk-..."
  # ANTHROPIC_API_KEY: "sk-ant-..."
  # DATABASE_URL: "postgresql+psycopg://user:pass@host:5432/db"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: live-ai-assistant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: live-ai-assistant
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: live-ai-assistant
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: live-ai-assistant
