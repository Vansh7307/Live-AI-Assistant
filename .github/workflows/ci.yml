name: CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy .

      - name: Security lint (bandit)
        run: bandit -q -r . -x ./tests

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Unit tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

      - name: Build Docker image
        working-directory: .
        run: docker build -f backend/Dockerfile -t live-ai-assistant-backend:ci ./backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate frontend HTML
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for JS syntax errors
        run: |
          cd frontend
          # Extract inline script and validate with node
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const scripts = [...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];
            scripts.forEach((m, i) => {
              try { new Function(m[1]); console.log('script ' + i + ' OK'); }
              catch (e) { console.error('script ' + i + ' FAIL:', e.message); process.exit(1); }
            });
          "

